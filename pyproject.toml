[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kali-mcp-server"
version = "0.1.0"
description = "Containerized Kali Linux MCP server for authorized security testing"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "uvicorn==0.54.0",
]

[project.scripts]
kali-mcp-server = "kali_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
