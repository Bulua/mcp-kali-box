services:
  kali-mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        KALI_BASE_IMAGE: kalilinux/kali-rolling:latest
        KALI_APT_MIRROR: ${KALI_APT_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/kali}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.cloud.tencent.com/pypi/simple/}
    image: kali-mcp-server:0.1.0
    container_name: kali-mcp
    init: true
    ports:
      - "${KALI_MCP_BIND_IP:-127.0.0.1}:${KALI_MCP_HOST_PORT:-8000}:8000"
    volumes:
      - ./workspace:/workspace
    privileged: true
    environment:
      KALI_MCP_TRANSPORT: dual
      KALI_MCP_MAX_OUTPUT: "8000"
      KALI_MCP_API_TOKEN: ${KALI_MCP_API_TOKEN:?Set KALI_MCP_API_TOKEN in .env}
    restart: unless-stopped
